{{ define "page" }}
<article class="container">
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  <ul class="post-list">
    {{ range .Pages.ByDate.Reverse }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        {{ with .Date }}<time datetime="{{ .Format "2006-01-02" }}">{{ .Format "January 2, 2006" }}</time>{{ end }}
      </li>
    {{ else }}
      <li>No content yet.</li>
    {{ end }}
  </ul>
</article>
{{ end }}
