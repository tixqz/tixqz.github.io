baseURL = "https://tixqz.github.io/"
languageCode = "en-us"
title = "Platforming Rant"
# Copyright notice. This is displayer in the footer.
copyright = "&copy; Copyright notice"
mainSections = ["posts"]

[outputs]
  home = ["HTML", "RSS"]

[outputFormats.RSS]
  mediatype = "application/rss+xml"
  baseName = "feed"

[params]
  description = "Exploring the latest in technology and development"
  # Logo image. This is displayed ogp image.
  # logo = "/path/to/logo"
  # favicon = "/path/to/favicon"

[[menu.main]]
    name = "Posts"
    url = "/posts"
    weight = 1

[[menu.main]]
    name = "RSS"
    url = "/feed.xml"
    weight = 2

